name: Android Release
on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths: ['app/build.gradle.kts']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve release tag from the application version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$TAG"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: python3 -I tools/prepare_sherpa.py --output app/libs/sherpa
      - name: Decode stable PKCS12
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/openlistener.p12"
      - name: Test release metadata generation
        run: python3 -I tools/test_release_metadata.py
      - name: Lint and JVM tests
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/openlistener.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest
      - name: Assemble signed universal APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/openlistener.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PreleaseAbi=universal assembleRelease
      - name: Save universal APK output
        run: mkdir -p release-input/universal && cp app/build/outputs/apk/release/app-release.apk release-input/universal/ && cp app/build/outputs/apk/release/output-metadata.json release-input/universal/
      - name: Assemble signed ARM64 APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/openlistener.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PreleaseAbi=arm64-v8a assembleRelease
      - name: Save ARM64 APK output
        run: mkdir -p release-input/arm64 && cp app/build/outputs/apk/release/app-release.apk release-input/arm64/ && cp app/build/outputs/apk/release/output-metadata.json release-input/arm64/
      - name: Verify signatures and create metadata
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          python3 -I tools/create_release_metadata.py \
            --universal-apk release-input/universal/app-release.apk \
            --universal-metadata release-input/universal/output-metadata.json \
            --arm64-apk release-input/arm64/app-release.apk \
            --arm64-metadata release-input/arm64/output-metadata.json \
            --tag "$TAG" --output release --aapt "$AAPT" --apksigner "$SIGNER"
      - name: Publish only verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file docs/RELEASE_NOTES.md --title "Open Listener $TAG"
      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/openlistener.p12"
